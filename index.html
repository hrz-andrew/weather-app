<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bay Area Weather Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <!-- Local ECMWF forecast data — written daily by the scheduled Windy scraper task.
         If the file is absent the dashboard falls back to the Open-Meteo API. -->
    <script src="forecast-data.js" onerror="console.warn('[wx] forecast-data.js not found — API fallback active')"></script>
    <!-- Per-lake static knowledge (anoxic dates, lake type, notes) consumed by insights.js. -->
    <script src="lake-metadata.js"></script>
    <!-- Bass-fishing scoring engine. Reads the internal weather shape + LAKE_META,
         returns ranked verdicts for the Insights section. Pure logic — no DOM. -->
    <script src="insights.js?v=dispwin-1"></script>
    <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>

<header>
    <div class="header-left">
        <h1>🌊 Bay Area Weather Dashboard</h1>
        <p class="subtitle" id="updated-time">Initializing…</p>
        <p class="subtitle" id="model-ref" style="color:#2a5a7a"></p>
    </div>

    <!-- Centre column: water-type switcher -->
    <div class="water-switcher" id="water-switcher">
        <button class="water-btn active" id="water-freshwater"
                onclick="setLocationSet('freshwater', this)">
            <span class="water-icon">🏞️</span>
            <span>Freshwater</span>
        </button>
        <button class="water-btn" id="water-saltwater"
                onclick="setLocationSet('saltwater', this)">
            <span class="water-icon">🌊</span>
            <span>Saltwater</span>
        </button>
    </div>

    <!-- Right column: model switcher + actions -->
    <div class="header-actions">
        <div class="model-switcher">
            <label>Model:</label>
            <button class="model-btn active" id="btn-ecmwf-local" onclick="setModel('ecmwf-local', this)" title="ECMWF forecast via JSONBin">JSON</button>
            <button class="model-btn" id="btn-ecmwf" onclick="setModel('ecmwf', this)" title="ECMWF IFS via Open-Meteo API (~25 km)">ECMWF</button>
            <!-- GFS + NAM tucked into a dropdown -->
            <div class="model-dropdown" id="model-dropdown-wrapper">
                <button class="model-btn" id="btn-more-models" onclick="toggleModelDropdown(event)" title="More models">More ▾</button>
                <div class="model-dropdown-menu" id="model-dropdown-menu">
                    <button class="model-btn" id="btn-gfs" onclick="setModel('gfs', this); closeModelDropdown()" title="NOAA GFS via Open-Meteo API (~13 km, 10-day)">GFS</button>
                    <button class="model-btn" id="btn-namConus" onclick="setModel('namConus', this); closeModelDropdown()" title="NOAA NAM CONUS via Open-Meteo API (~12 km, 84h)">NAM</button>
                </div>
            </div>
        </div>
        <button class="btn btn-refresh" onclick="refreshAll()">↻ Refresh</button>
        <button class="btn btn-primary" onclick="openModal()">+ Add Location</button>
    </div>
</header>

<div class="main">

    <!-- Bass-fishing insights (freshwater only).
         Outer wrapper preserved so toggleSummary() / collapsed CSS still works.
         renderInsights() fills #insights-grid with one card per location, ranked
         by INSIGHTS.scoreAllLocations() into the upcoming Fri–Sun window. -->
    <div class="summary-section" id="summary-section">
        <div class="section-title" onclick="toggleSummary()">
            🎣 Upcoming Weekend Insights
            <span class="section-chevron">▼</span>
        </div>
        <div class="summary-body" id="summary-body">
            <!-- Weekly outlook strip — macro pattern across the forecast horizon.
                 Sits above the weekend cards to set context. Hidden by JS when
                 there isn't enough data (< 3 forward days or < 2 lakes). -->
            <div class="weekly-outlook" id="weekly-outlook" style="display:none"></div>
            <div class="insights-head" id="insights-head"></div>
            <div class="insights-grid" id="insights-grid">
                <div class="loading-state" style="grid-column:1/-1; padding:16px">
                    <div class="spinner"></div>
                    <span style="font-size:13px">Scoring weekend windows…</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Day selector — full-width bar sitting right above the location cards -->
    <div class="day-tabs-bar">
        <div class="period-toggle" id="period-toggle">
            <!-- Mon-Sun tabs are generated dynamically by renderDayTabs() -->
        </div>
    </div>

    <!-- Cards -->
    <div class="locations-grid" id="locations-grid"></div>

</div>

<!-- Add Location Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <h3>Add New Location</h3>
        <p>Enter a name and the GPS coordinates. You can find coordinates at <a href="https://maps.google.com" target="_blank" style="color:#3a7aaa">maps.google.com</a> by right-clicking any point.</p>
        <div id="modal-error" style="display:none" class="modal-error"></div>
        <div class="form-group">
            <label>Location Name</label>
            <input type="text" id="m-name" placeholder="e.g. Half Moon Bay" />
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Latitude</label>
                <input type="number" id="m-lat" placeholder="37.4636" step="0.0001" />
            </div>
            <div class="form-group">
                <label>Longitude</label>
                <input type="number" id="m-lon" placeholder="-122.4286" step="0.0001" />
            </div>
        </div>
        <p class="geo-hint">Tip: Latitude for CA is ~37–38, Longitude is ~-121 to -122</p>
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn btn-add-confirm" onclick="addLocation()">Add Location</button>
        </div>
    </div>
</div>

<script src="app.js?v=1"></script>
</body>
</html>
